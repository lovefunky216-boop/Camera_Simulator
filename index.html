<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Southern Italy on Film | Hasselblad 503CX</title>
  <meta name="description" content="핫셀블라드 503CX 아날로그 중형 카메라 일러스트 시뮬레이터. 뚜껑을 열고 셔터를 눌러 120 필름 사진을 찍고 확대해보세요.">

  <!-- Tailwind CSS & OpenSeadragon CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-5 bg-[#08080a] text-zinc-100 select-none overflow-x-hidden font-sans">

  <!-- 1. 헤더: 미니멀 브랜드 & 단계별 안내 가이드 -->
  <header class="w-full max-w-lg mx-auto flex flex-col items-center justify-center gap-2 pt-1 pb-2">
    <div class="flex items-center gap-2">
      <span class="w-5 h-5 rounded-full bg-[#ff6a00] flex items-center justify-center font-black text-black text-xs">H</span>
      <h1 class="text-xs md:text-sm font-bold tracking-[0.25em] text-white uppercase">
        HASSELBLAD 503CX
      </h1>
      <span class="text-[10px] text-zinc-500 font-mono">· SOUTHERN ITALY ON FILM 🇮🇹</span>
    </div>

    <!-- 단계별 가이드 안내 바 -->
    <div class="bg-zinc-900/90 border border-zinc-800 rounded-full px-4 py-1.5 text-xs text-zinc-300 font-medium shadow-md flex items-center gap-1.5">
      <div id="camera-step-guide" class="flex items-center">
        <span class="animate-bounce inline-block mr-1">👆</span>
        <span class="text-white font-bold">카메라 뚜껑을 탭하여 열어보세요.</span>
      </div>
    </div>
  </header>

  <!-- 2. 메인 시네마틱 스테이지 -->
  <main class="w-full max-w-lg mx-auto flex flex-col items-center justify-center flex-grow relative">

    <!-- 셔터 순간 광학 플래시 & 암전 레이어 -->
    <div id="screen-blackout" class="fixed inset-0 bg-black opacity-0 pointer-events-none transition-opacity duration-150 z-50"></div>

    <!-- ============================================================
         STAGE 1 : 핫셀블라드 503CX 그래픽 일러스트 바디 (렌즈 + 양손 + 후드 개폐)
         ============================================================ -->
    <div id="camera-pov-stage" class="relative w-[320px] sm:w-[380px] md:w-[410px] aspect-[9/16] rounded-2xl overflow-hidden shadow-[0_25px_60px_rgba(0,0,0,0.95)] border border-zinc-800/80 bg-[#0c0c0e]">
      
      <!-- [상태 1] 뚜껑이 닫힌 503CX 일러스트 그래픽 (자이스 렌즈 + 양손 + 닫힌 후드) -->
      <div id="camera-closed-view" class="absolute inset-0 z-10 transition-opacity duration-300 flex items-center justify-center">
        <img src="assets/503cx_closed.jpg" alt="Hasselblad 503CX Illustration Closed" class="w-full h-full object-cover select-none pointer-events-none">
        
        <!-- 뚜껑 인터랙티브 핫스팟 클릭 영역 -->
        <div id="hood-lid-trigger" class="absolute top-[36%] left-[20%] w-[60%] h-[32%] cursor-pointer group flex flex-col items-center justify-center rounded-2xl" title="뚜껑 열기">
          <div class="bg-black/85 backdrop-blur-md border border-[#ff6a00]/80 group-hover:bg-[#ff6a00] group-hover:text-black text-[#ff8e3d] text-xs font-bold px-4 py-2 rounded-full shadow-2xl transition-all transform group-hover:scale-105 animate-pulse flex items-center gap-1.5">
            <span>👆</span>
            <span>TAP TO OPEN</span>
          </div>
        </div>
      </div>

      <!-- [상태 2] 뚜껑이 열리고 뷰파인더에 남부 이탈리아가 비치는 503CX 일러스트 그래픽 -->
      <div id="camera-open-view" class="absolute inset-0 z-10 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center">
        <img src="assets/503cx_open.jpg" alt="Hasselblad 503CX Illustration Open" class="w-full h-full object-cover select-none pointer-events-none">

        <!-- 셔터 인터랙티브 핫스팟 클릭 영역 (카메라 우측 하단 셔터 위치) -->
        <div id="shutter-trigger" class="absolute bottom-[28%] right-[8%] w-[22%] h-[14%] cursor-pointer group flex items-center justify-center rounded-full" title="셔터 누르기">
          <div class="relative flex items-center justify-center">
            <span class="absolute w-12 h-12 rounded-full bg-[#ff6a00] opacity-40 animate-ping"></span>
            <div class="relative w-10 h-10 rounded-full bg-gradient-to-tr from-[#ff4500] to-[#ff8e3d] border-2 border-white shadow-2xl flex items-center justify-center transform group-hover:scale-110 active:scale-95 transition-transform">
              <span class="w-3.5 h-3.5 rounded-full bg-white"></span>
            </div>
          </div>
        </div>

        <!-- 하단 셔터 안내 버튼 -->
        <div class="absolute bottom-4 inset-x-0 flex justify-center pointer-events-auto">
          <button id="shutter-btn-bottom" class="bg-black/85 hover:bg-[#ff6a00] hover:text-black border border-[#ff6a00]/70 text-[#ff8e3d] font-mono text-xs font-bold px-4 py-2 rounded-full shadow-2xl transition-all transform active:scale-95 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
            <span>SHUTTER RELEASE (또는 SPACE 키)</span>
          </button>
        </div>
      </div>

    </div>

    <!-- ============================================================
         STAGE 2 : 촬영된 120 중형 필름 6x6 사진 & 무한 딥 줌 뷰어
         ============================================================ -->
    <div id="photo-result-stage" class="hidden w-full flex flex-col items-center justify-center transition-all duration-700">
      
      <!-- 6x6 스퀘어 필름 카드 -->
      <div class="relative flex flex-col items-center bg-black p-3 md:p-4 rounded-xl border border-zinc-800 shadow-2xl">
        
        <!-- 상단 필름 엣지 각인 -->
        <div class="w-full flex items-center justify-between text-[10px] font-mono text-amber-500/90 px-1 pb-2">
          <span>KODAK PORTRA 400 · 120 FILM</span>
          <span>FRAME 08</span>
          <span>HASSELBLAD 503CX</span>
        </div>

        <!-- 필름 사진 딥 줌 컨테이너 (OpenSeadragon) -->
        <div id="film-zoom-viewer" class="relative w-[320px] h-[320px] sm:w-[440px] sm:h-[440px] md:w-[480px] md:h-[480px] bg-[#050507] rounded-sm overflow-hidden cursor-crosshair"></div>

        <!-- 하단 확대율 안내 -->
        <div class="w-full flex items-center justify-between text-[11px] font-mono text-zinc-400 px-1 pt-2.5">
          <span>🔍 마우스 휠이나 터치로 자유롭게 무한 확대</span>
          <span>ZOOM: <span id="current-zoom-pct" class="text-white font-bold">100%</span></span>
        </div>

      </div>

      <!-- 하단 리셋 버튼: 딱 하나! -->
      <div class="mt-4 flex items-center justify-center">
        <button id="reshoot-camera-btn" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-zinc-800 to-zinc-900 hover:from-zinc-700 hover:to-zinc-800 text-white text-xs font-bold transition flex items-center gap-2 border border-zinc-700 shadow-lg hover:border-[#ff6a00]">
          <svg class="w-4 h-4 text-[#ff6a00]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>↺ 뚜껑 닫고 다시 찍기</span>
        </button>
      </div>

    </div>

  </main>

  <!-- 3. 푸터 -->
  <footer class="w-full max-w-lg mx-auto text-center py-2 text-[10px] text-zinc-600 font-mono">
    Hasselblad 503CX Film Camera Simulator · Kodak Portra 400
  </footer>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/camera503.js"></script>

</body>
</html>
