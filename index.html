<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Southern Italy on Film | Hasselblad 503CX</title>
  <meta name="description" content="핫셀블라드 503CX 뚜껑을 열어 풍경을 보고 셔터를 눌러 필름 사진을 찍고 확대해보는 실감 아날로그 시뮬레이터">

  <!-- Tailwind CSS & OpenSeadragon CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-5 bg-[#09090b] text-zinc-100 select-none overflow-x-hidden font-sans">

  <!-- 1. 헤더: 미니멀 브랜드 & 안내 가이드 -->
  <header class="w-full max-w-xl mx-auto flex flex-col items-center justify-center gap-2 pt-1 pb-3">
    <div class="flex items-center gap-2">
      <span class="w-5 h-5 rounded-full bg-[#ff6a00] flex items-center justify-center font-black text-black text-xs">H</span>
      <h1 class="text-xs md:text-sm font-bold tracking-[0.25em] text-white uppercase">
        HASSELBLAD 503CX
      </h1>
      <span class="text-[10px] text-zinc-500 font-mono">· SOUTHERN ITALY ON FILM 🇮🇹</span>
    </div>

    <!-- 단계별 가이드 안내 바 -->
    <div class="bg-zinc-900/90 border border-zinc-800 rounded-full px-4 py-1.5 text-xs text-zinc-300 font-medium shadow-md flex items-center gap-1.5">
      <div id="camera-step-guide" class="flex items-center">
        <span class="animate-bounce inline-block mr-1">👆</span>
        <span class="text-white font-bold">카메라 뚜껑을 탭하여 열어보세요.</span>
      </div>
    </div>
  </header>

  <!-- 2. 메인 시네마틱 스테이지 -->
  <main class="w-full max-w-xl mx-auto flex flex-col items-center justify-center flex-grow relative">

    <!-- 셔터 순간 광학 플래시 & 암전 레이어 -->
    <div id="screen-blackout" class="fixed inset-0 bg-black opacity-0 pointer-events-none transition-opacity duration-150 z-50"></div>

    <!-- ============================================================
         STAGE 1 : 핫셀블라드 503CX 실사 바디 POV (뚜껑 닫힘 & 열림)
         ============================================================ -->
    <div id="camera-pov-stage" class="relative w-[340px] sm:w-[380px] md:w-[410px] aspect-[9/16] rounded-2xl overflow-hidden shadow-[0_25px_60px_rgba(0,0,0,0.95)] border-2 border-zinc-800 bg-black">
      
      <!-- [상태 1] 뚜껑이 닫혀있는 503CX 실사 뷰 (상단 렌즈 + 두 손 + 닫힌 뚜껑) -->
      <div id="camera-closed-view" class="absolute inset-0 z-10 transition-opacity duration-300">
        <img src="assets/503cx_closed.jpg" alt="Hasselblad 503CX Closed" class="w-full h-full object-cover">

        <!-- 뚜껑 인터랙티브 핫존 클릭 영역 -->
        <div id="hood-lid-trigger" class="absolute top-[34%] left-[19%] w-[62%] h-[33%] cursor-pointer group flex flex-col items-center justify-center rounded-xl" title="뚜껑 탭하여 열기">
          <div class="bg-black/75 backdrop-blur-sm border border-[#ff6a00]/70 group-hover:bg-[#ff6a00] group-hover:text-black text-[#ff8e3d] text-[11px] font-bold px-3 py-1.5 rounded-full shadow-lg transition-all transform group-hover:scale-105 animate-pulse flex items-center gap-1.5">
            <span>👆</span>
            <span>TAP TO OPEN</span>
          </div>
        </div>
      </div>

      <!-- [상태 2] 뚜껑이 열려있는 503CX 실사 뷰 (상단 렌즈 + 두 손 + 열린 후드 + 뷰파인더) -->
      <div id="camera-open-view" class="absolute inset-0 z-20 opacity-0 pointer-events-none transition-opacity duration-300">
        <img src="assets/503cx_open.jpg" alt="Hasselblad 503CX Open" class="w-full h-full object-cover">

        <!-- 그라운드 글래스 스크린 영역: 남부 이탈리아 풍경 실시간 투영 -->
        <div class="absolute top-[40.6%] left-[25.5%] w-[49%] h-[23.8%] overflow-hidden rounded-sm border border-zinc-600 shadow-inner bg-black">
          <!-- 남부 이탈리아 풍경 -->
          <img src="assets/southern_italy.jpg" alt="Southern Italy Viewfinder" class="w-full h-full object-cover brightness-105 contrast-105">
          
          <!-- 핫셀블라드 뷰파인더 격자 십자선 오버레이 -->
          <div class="absolute inset-0 pointer-events-none grid-crosshairs opacity-70"></div>
          <div class="absolute bottom-1 inset-x-0 text-center text-[7px] tracking-[0.2em] text-white/50 font-serif italic pointer-events-none">
            HASSELBLAD
          </div>
        </div>

        <!-- 전면 크롬 셔터 릴리즈 버튼 트리거 -->
        <div id="shutter-trigger" class="absolute bottom-[10%] right-[10%] cursor-pointer group flex flex-col items-center gap-1 z-30" title="찰칵! 사진 찍기 (스페이스바)">
          <div class="w-14 h-14 rounded-full bg-gradient-to-b from-white via-zinc-300 to-zinc-600 p-1 shadow-2xl border-2 border-white group-hover:scale-105 group-active:scale-95 transition-transform flex items-center justify-center">
            <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-500 shadow-inner flex items-center justify-center text-[#ff6a00] text-xs font-bold">
              📷
            </div>
          </div>
          <span class="text-[9px] bg-black/80 px-2 py-0.5 rounded-full font-mono text-[#ff8e3d] font-bold tracking-wider group-hover:text-white">
            찰칵! SHUTTER
          </span>
        </div>

      </div>

    </div>

    <!-- ============================================================
         STAGE 2 : 촬영된 120 중형 필름 6x6 사진 & 무한 딥 줌 뷰어
         ============================================================ -->
    <div id="photo-result-stage" class="hidden w-full flex flex-col items-center justify-center transition-all duration-700">
      
      <!-- 6x6 스퀘어 필름 카드 -->
      <div class="relative flex flex-col items-center bg-black p-3 md:p-4 rounded-xl border border-zinc-800 shadow-2xl">
        
        <!-- 상단 필름 엣지 각인 -->
        <div class="w-full flex items-center justify-between text-[10px] font-mono text-amber-500/90 px-1 pb-2">
          <span>KODAK PORTRA 400 · 120 FILM</span>
          <span>FRAME 08</span>
          <span>HASSELBLAD 503CX</span>
        </div>

        <!-- 필름 사진 딥 줌 컨테이너 (OpenSeadragon) -->
        <div id="film-zoom-viewer" class="relative w-[320px] h-[320px] sm:w-[440px] sm:h-[440px] md:w-[500px] md:h-[500px] bg-[#050507] rounded-sm overflow-hidden cursor-crosshair"></div>

        <!-- 하단 확대율 안내 -->
        <div class="w-full flex items-center justify-between text-[11px] font-mono text-zinc-400 px-1 pt-2.5">
          <span>🔍 마우스 휠이나 터치로 자유롭게 무한 확대</span>
          <span>ZOOM: <span id="current-zoom-pct" class="text-white font-bold">100%</span></span>
        </div>

      </div>

      <!-- 하단 리셋 버튼: 딱 하나! -->
      <div class="mt-4 flex items-center justify-center">
        <button id="reshoot-camera-btn" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-zinc-800 to-zinc-900 hover:from-zinc-700 hover:to-zinc-800 text-white text-xs font-bold transition flex items-center gap-2 border border-zinc-700 shadow-lg hover:border-[#ff6a00]">
          <svg class="w-4 h-4 text-[#ff6a00]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>↺ 뚜껑 닫고 다시 찍기</span>
        </button>
      </div>

    </div>

  </main>

  <!-- 3. 푸터 -->
  <footer class="w-full max-w-xl mx-auto text-center py-2 text-[10px] text-zinc-600 font-mono">
    Hasselblad 503CX Film Camera Simulator · Kodak Portra 400
  </footer>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/camera503.js"></script>

</body>
</html>
